services:
  - type: web
    name: finguard-api
    env: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: finguard-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: finguard-cache
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: CORS_ORIGINS
        value: "*" # Recommended: Update this with your frontend URL

  - type: database
    name: finguard-db
    plan: free
    databaseName: finguard
    user: finguard_admin

  - type: redis
    name: finguard-cache
    plan: free
    ipAllowList: [] # Internal only
