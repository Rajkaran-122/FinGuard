services:
  - type: web
    name: finguard-api
    env: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: finguard-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRY_HOURS
        value: 24
      - key: ENVIRONMENT
        value: production
      - key: CORS_ORIGINS
        value: "*" # Recommended: Update this with your frontend URL

  - type: database
    name: finguard-db
    plan: free
    databaseName: finguard
    user: finguard_admin
