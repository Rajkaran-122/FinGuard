services:
  - type: web
    name: finguard-api
    env: python
    buildCommand: "pip install -r requirements.txt && alembic upgrade head"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRY_HOURS
        value: 12
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        value: sqlite:////data/finance.db
    disk:
      name: finguard-data
      mountPath: /data
      sizeGB: 1
