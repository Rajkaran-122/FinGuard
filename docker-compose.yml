services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://finguard_user:finguard_pass@db:5432/finguard_db
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET=finguard-access-secret-rajkaran-yadav-2025
      - JWT_REFRESH_SECRET=finguard-refresh-secret-rajkaran-yadav-2025
      - ENVIRONMENT=development
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=finguard_user
      - POSTGRES_PASSWORD=finguard_pass
      - POSTGRES_DB=finguard_db
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finguard_user -d finguard_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
